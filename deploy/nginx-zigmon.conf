# /etc/nginx/conf.d/zigmon.conf
#
# The sensor dashboard on its own hostname. Port 80 redirects to 443;
# everything real is served over TLS.
#
# This block deliberately does NOT claim default_server, so it coexists with
# other sites on the same nginx (red.falco81.net for Node-RED, and so on):
# nginx picks the block by the Host header.
#
# The dashboard can open the Zigbee network for joining and erase history, so
# it stays restricted by address as well as encrypted — TLS protects the
# traffic, the allow rules decide who may ask at all.

# ---------------------------------------------------------------------------
# How often one address may press a one-tap link
# ---------------------------------------------------------------------------
# Refusing a flood belongs here rather than in the daemon. The daemon used to
# answer a wrong secret a second late, which stopped nobody - ten wrong tries
# a minute from one address is already all it will take - and held a php-fpm
# worker and a thread of the daemon for that second, which is a way to stop
# the dashboard rather than a way to stop a guesser.
#
# A minute's worth at one a second, with twenty allowed to arrive at once: a
# person pressing a lamp in a doorway never notices it, and a machine working
# through a list is answered 429 without anything behind nginx being woken.
# Counted against whoever pressed rather than against the connection: with a
# server in front, every press arrives from that one address and a single
# bucket would be shared by the whole internet - one person pressing a lamp
# would exhaust it for everybody. The claim is only as good as the server that
# made it, which is why the daemon checks it against trusted_proxies before
# believing it; here it is only being counted, and counting the wrong thing
# costs a 429 rather than a door left open.
map $http_x_forwarded_for $zigmon_presser {
    ""      $binary_remote_addr;    # nobody in front: the connection itself
    # The LAST address in the header, which is the one the server in front
    # wrote: everything to its left is whatever the caller claimed, and the
    # front adds to that rather than replacing it. Keyed on the whole header,
    # every new made-up prefix was a fresh bucket and the limit limited
    # nothing.
    "~(?<zigmon_last>[^,\s]+)\s*$" $zigmon_last;
    default $http_x_forwarded_for;
}
limit_req_zone $zigmon_presser zone=zigmon_tap:1m rate=60r/m;

# ---------------------------------------------------------------------------
# Plain HTTP: redirect and nothing else
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name mqtt.falco81.net;          # <- your hostname

    server_tokens off;
    # Automatic certificates (Control - Automatic certificates, 5.30): while
    # the certificate is ordered from an ACME CA by HTTP-01, root puts a
    # location for /.well-known/acme-challenge/ in here, between two marks of
    # zigmon's own (ACME-BEGIN, ACME-END), handed to index.php - the daemon
    # answers only the tokens of an order it has going. The return below is
    # then set aside (commented out with zigmon's mark) and stands in a
    # `location /` of the block, since a return at this level is done before
    # any location is looked at; everything else still goes to HTTPS. Both
    # come back as they were when ACME is switched off or goes to DNS-01.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS: the dashboard
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name mqtt.falco81.net;          # <- your hostname

    root  /var/www/zigmon;
    index index.php;

    server_tokens off;

    access_log /var/log/nginx/zigmon-access.log;
    error_log  /var/log/nginx/zigmon-error.log;

    # ---- certificates ----------------------------------------------------
    # The three files exactly as they are, nothing generated. These are the
    # same files mosquitto uses for its TLS listener on 8883.
    #
    # nginx sends ssl_certificate to clients verbatim, so whatever chain the
    # browser sees is whatever server.pem contains. server.ca is used only for
    # verifying OCSP responses; it is NOT sent to clients. If a client ever
    # complains the certificate is untrusted, check how many certificates are
    # in server.pem:  grep -c "BEGIN CERTIFICATE" /etc/nginx/certs/server.pem
    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_trusted_certificate   /etc/nginx/certs/server.ca;

    # ---- protocol --------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;

    # ---- session handling ------------------------------------------------
    ssl_session_cache         shared:ZIGMON:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- OCSP stapling ---------------------------------------------------
    # Harmless when the CA offers no OCSP responder (a private CA): nginx
    # simply logs a warning at start and staples nothing.
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ---- who may connect -------------------------------------------------
    # Encryption is not authorisation. Restrict by address too.
    allow 192.168.40.0/24;        # <- your subnets
    allow 172.16.16.0/24;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    # Optional password on top (the installer can set this up):
    #   htpasswd -c /etc/nginx/zigmon.htpasswd yourname
    # auth_basic           "Sensors";
    # auth_basic_user_file /etc/nginx/zigmon.htpasswd;

    # ---- security headers ------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # The dashboard loads nothing from anywhere else — no CDN, no fonts, no
    # analytics — so it can be locked to itself. 'unsafe-inline' is needed
    # because the page carries its own <style> and <script> inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- request shape ---------------------------------------------------
    # /api=status is ~140 kB of JSON with 35 devices and 15 plugs, fetched on
    # every live update; compressed it is ~15 kB, which matters on Wi-Fi/mobile.
    gzip on;
    # text/html is always compressed and naming it again is a warning at start
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    client_max_body_size 6m;      # a settings import or one piece of a database backup upload
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    # ---- the one shape PHP itself is broken by ---------------------------
    # php2shell, 21 October 2026: CVE-2026-109618 and CVE-2026-109619, both
    # 9.2. One of them is reached through PHP's own multipart parser, and it
    # runs before any page of this house does - so the PIN, the allow rules
    # above, the API token and every check written in index.php are all
    # behind the point where it happens. The version of PHP is the only real
    # fix (`zigmon check` says which one is installed and whether it carries
    # it); this is what can be done in front of it.
    #
    # Nothing in this house ever sends a multipart body. All three file
    # pickers on the dashboard - a settings export to put back, a trial file,
    # a database to restore - are read in the browser with FileReader and
    # sent as JSON or as the bytes themselves; there is no <form enctype>
    # and no FormData anywhere in the page. So refusing the shape costs the
    # dashboard nothing at all, and it stays here after the update: PHP's
    # multipart parser has now had two of these.
    #
    # 415 rather than a closed connection, because this vhost is the one
    # reachable from the sofa and a person debugging deserves a reason.
    if ($http_content_type ~* "^multipart/") { return 415; }

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- one-tap links ---------------------------------------------------
    # A watch or a phone opens /tap/<token> and that one link does its one
    # thing. The point of the shape is that there is nothing in it for a
    # phone to correct: no full stop, no equals sign, no ampersand. An
    # address typed by hand as index.php?api=tap&t=... comes out of a phone
    # keyboard as index-php?api-tap&t=... and goes nowhere.
    # the quotes matter: nginx reads { and } as the start and end of a block,
    # so an unquoted {8,64} cuts the expression off at the brace and it
    # refuses to start with "missing ) in ..."
    # The header road: one address for every link, the secret in a header of
    # a POST. Nothing of it reaches this log, a link-preview fetcher cannot
    # trip it by following a URL, and there is no address for a browser to
    # keep in its history. POST only, because a GET here would be exactly the
    # thing this shape exists to avoid.
    # Anything but a POST is answered rather than refused: opening this
    # address in a browser is the first thing anybody does to see whether it
    # is there, and a bare 403 from nginx says nothing about why. The address
    # is the same for every link and carries no secret, so saying what it
    # wants gives nothing away.
    location = /tap {
        # ---- the one road a server in front may take ---------------------
        # A front nginx published to the internet needs this address and
        # nothing else. Naming it here rather than in the "allow" list at the
        # top of the server keeps it to this one road: the rules in a location
        # replace the ones above them, so the dashboard itself stays as it
        # was. Put the front server's address first and leave the rest as they
        # are, so a phone on the sofa still works.
        #
        allow 192.168.43.17;          # <- the server in front
        allow 192.168.40.0/24;
        allow 172.16.16.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        # NOT set_real_ip_from here. It is the obvious thing to reach for and
        # it breaks this: real_ip rewrites the address before the allow rules
        # are read, so the connection stops being the server in front and
        # becomes whoever pressed - and "allow 192.168.43.17" then matches
        # nothing. Whoever pressed is worked out behind this instead: the
        # relay passes the X-Forwarded-For along under its own name, and the
        # daemon believes it only from an address written in trusted_proxies
        # (Settings -> Keeping addresses out). Put the front server's address
        # there and the log, the press list and the counting all name the
        # right person.
        limit_req zone=zigmon_tap burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        # out here, not inside the if: nginx allows very little in an if block
        # and default_type is not on the list - it refuses to start with
        # "default_type directive is not allowed here"
        default_type application/json;
        if ($request_method != POST) {
            return 405 '{"ok":false,"error":"this address takes a POST carrying an X-Zigmon-Tap header"}';
        }
        # Handed to PHP here rather than sent round again as /index.php: a
        # rewrite re-enters the location list and lands in the php block,
        # where the server's own allow rules apply - and a front server
        # allowed on this road only would be refused there.
        # fastcgi_params FIRST, then what this road changes. It sets
        # QUERY_STRING to the request's own query, so included last it wipes
        # the api=tap put here: PHP then saw no query at all and answered with
        # the whole dashboard page - 200, a megabyte of HTML, and nothing in
        # the daemon's log, which is a hard thing to read as a fault.
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        # api=tap and nothing else. The caller's own query used to follow it,
        # and PHP keeps the last of two parameters with the same name - so
        # /tap?api=status reached the whole of the dashboard's API from the
        # internet. The header road takes nothing from the query anyway.
        # (index.php pins this road by its address as well, for a file that
        # still carries the old line.)
        fastcgi_param  QUERY_STRING    api=tap;
        fastcgi_param  HTTPS on;
    }

    location = /api/sms/incoming {
        # ---- the road the SMS gateway pushes an arriving message down -----
        # Its own location for the same reason /tap has one: the rules here
        # replace the ones at the top of the server, so the gateway is allowed
        # on this one address and nowhere else in the dashboard. It is a box
        # on a network of its own with a SIM card in it; it has no business
        # anywhere but here.
        #
        allow 192.168.47.254;         # <- the SMS gateway, that one address
        allow 192.168.40.0/24;        # (so a browser can test it by hand)
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        # It carries no token and no PIN - it cannot; what makes a message
        # ours is the word agreed with it, which the daemon checks. So this
        # road is narrow on purpose: one method, a small body, and a rate
        # limit, because anybody who reaches it is trying the word.
        if ($request_method != POST) {
            return 405 "";
        }
        limit_req zone=zigmon_tap burst=10 nodelay;
        client_max_body_size 8k;

        # Handed to PHP here rather than rewritten, for the same reason as
        # /tap: a rewrite re-enters the location list and lands in the php
        # block, where the server's own allow rules apply, and the gateway
        # would be refused there.
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  QUERY_STRING    api=sms-incoming&$args;
        fastcgi_param  HTTPS on;
    }

    location ~ "^/tap/([A-Za-z0-9_-]{8,64})$" {
        # the address road, from the same places as the header road above.
        # A link whose secret is in the address is worth thinking twice about
        # before letting a server in front reach it: the secret is in the URL,
        # so it is in that server's log.
        #
        allow 192.168.43.17;          # <- the server in front
        allow 192.168.40.0/24;
        allow 172.16.16.0/24;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        # no set_real_ip_from here either, for the reason given on the other
        # road: it would turn the connection into the presser and the allow
        # rule into nothing
        limit_req zone=zigmon_tap burst=20 nodelay;
        limit_req_status 429;
        # the capture has to be made by the rewrite's own expression: a
        # rewrite resets $1..$9 to its own captures, so "rewrite ^" - which
        # captures nothing - leaves $1 empty and the token never arrives
        # &$args keeps whatever was on the end: a replacement containing a ?
        # throws the original query away, so /tap/TOKEN?ask arrived as a plain
        # press and switched the thing it was asked about
        # handed straight to PHP, for the reason given above the other road
        # fastcgi_params first, for the reason given on the other road
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  QUERY_STRING    t=$1&$args;
        fastcgi_param  HTTPS on;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # Erasing a large history runs VACUUM, which can take a while.
        fastcgi_read_timeout 120s;
    }

    location ~ /\.        { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
