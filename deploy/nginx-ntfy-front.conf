}
map $ntfy_uri2 $ntfy_urij {
    "~*(?s)^(?<ntfyu3a>.*[&?;{,\\s\"\\'#\\[(/][\"\\']?(?:[^\\s&?;=:\"\\'{},#]*?(?:pass|pwd|token|secret|api[_-]?key|auth|session|credential|jwt|csrf|xsrf|bearer|signature|cookie|passwort|wachtwoord|senha|parola|haslo|heslo|jelszo|salasana|losenord|passord|sifre|kennwort|contrase)[^\\s&?;=:\"\\'{},#]*|(?:[^\\s&?;=:\"\\'{},#]*[_.\\[-])?(?:pin|otp|totp|sid|code|key|tap|sig|pw|ticket)(?:[_.\\]-][^\\s&?;=:\"\\'{},#]*)?)[\"\\']?\\s*[:=]\\s*\\[?\\s*[\"\\']?)(?:(?<=\")(?!\\*)[^\"]+|(?<=\\')(?!\\*)[^\\']+|\\{[^}]*|(?!\\*)[^&\"\\',}\\[\\]\\s]+)(?<ntfyu3b>.*)$"  "$ntfyu3a*$ntfyu3b";
    default $ntfy_uri2;
}
map $ntfy_urij $ntfy_uri {
    "~(?s)^(?<ntfyuja>.*?eyJ[A-Za-z0-9_-]{4,400}\.)[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_.-]*(?<ntfyujb>.*)$"  "$ntfyuja*$ntfyujb";
    default $ntfy_urij;
}
map $http_origin $ntfy_origin {
    "~^(?<ntfyoia>[A-Za-z][A-Za-z0-9+.-]*://)[^/@\\s]+@(?<ntfyoib>.*)$"  "$ntfyoia*@$ntfyoib";
    default $http_origin;
}
map $http_referer $ntfy_ref0 {
    "~^(?<ntfyria>[A-Za-z][A-Za-z0-9+.-]*://)[^/@\\s]+@(?<ntfyrib>.*)$"  "$ntfyria*@$ntfyrib";
    default $http_referer;
}
# (pass 3) a link's secret in a whole address, as a Referer carries it: a
# browser that opened /tap/<secret> names it in what it asks for next
map $ntfy_ref0 $ntfy_refp {
    "~^(?<ntfyrf0>(?:[A-Za-z][A-Za-z0-9+.-]{0,15}://[^/?#\\s]{0,255})?/(?:api/)?tap/)[^/?#]+(?<ntfyrf1>.*)$"  "$ntfyrf0*$ntfyrf1";
    default $ntfy_ref0;
}
map $ntfy_refp $ntfy_ref1 {
    "~*(?s)^(?<ntfyr1a>(?:.*?[&?;{,\\s\"\\'#\\[(/])?[\"\\']?(?:[^\\s&?;=:\"\\'{},#]*?(?:pass|pwd|token|secret|api[_-]?key|auth|session|credential|jwt|csrf|xsrf|bearer|signature|cookie|passwort|wachtwoord|senha|parola|haslo|heslo|jelszo|salasana|losenord|passord|sifre|kennwort|contrase)[^\\s&?;=:\"\\'{},#]*|(?:[^\\s&?;=:\"\\'{},#]*[_.\\[-])?(?:pin|otp|totp|sid|code|key|tap|sig|pw|ticket)(?:[_.\\]-][^\\s&?;=:\"\\'{},#]*)?)[\"\\']?\\s*[:=]\\s*\\[?\\s*[\"\\']?)(?:(?<=\")(?!\\*)[^\"]+|(?<=\\')(?!\\*)[^\\']+|\\{[^}]*|(?!\\*)[^&\"\\',}\\[\\]\\s]+)(?<ntfyr1b>.*)$"  "$ntfyr1a*$ntfyr1b";
    default $ntfy_refp;
}
map $ntfy_ref1 $ntfy_refj {
    "~*(?s)^(?<ntfyr2a>.*[&?;{,\\s\"\\'#\\[(/][\"\\']?(?:[^\\s&?;=:\"\\'{},#]*?(?:pass|pwd|token|secret|api[_-]?key|auth|session|credential|jwt|csrf|xsrf|bearer|signature|cookie|passwort|wachtwoord|senha|parola|haslo|heslo|jelszo|salasana|losenord|passord|sifre|kennwort|contrase)[^\\s&?;=:\"\\'{},#]*|(?:[^\\s&?;=:\"\\'{},#]*[_.\\[-])?(?:pin|otp|totp|sid|code|key|tap|sig|pw|ticket)(?:[_.\\]-][^\\s&?;=:\"\\'{},#]*)?)[\"\\']?\\s*[:=]\\s*\\[?\\s*[\"\\']?)(?:(?<=\")(?!\\*)[^\"]+|(?<=\\')(?!\\*)[^\\']+|\\{[^}]*|(?!\\*)[^&\"\\',}\\[\\]\\s]+)(?<ntfyr2b>.*)$"  "$ntfyr2a*$ntfyr2b";
    default $ntfy_ref1;
}
map $ntfy_refj $ntfy_ref {
    "~(?s)^(?<ntfyrja>.*?eyJ[A-Za-z0-9_-]{4,400}\.)[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_.-]*(?<ntfyrjb>.*)$"  "$ntfyrja*$ntfyrjb";
    default $ntfy_refj;
}

log_format ntfyfull escape=json
    '{"ip":"$remote_addr","t":"$time_iso8601","m":"$request_method","u":"$ntfy_uri",'
    '"proto":"$server_protocol","s":$status,"bytes":$body_bytes_sent,"took":$request_time,'
    '"host":"$http_host","ua":"$http_user_agent","ref":"$ntfy_ref",'
    '"ct":"$content_type","clen":"$content_length","body":"$ntfy_body",'
    '"secret":"$ntfy_auth","code":"none",'
    '"xff":"$http_x_forwarded_for",'
    '"xfh":"$http_x_forwarded_host","xou":"$http_x_original_url",'
    '"xru":"$http_x_rewrite_url","xfp":"$http_x_forwarded_proto",'
    '"origin":"$ntfy_origin","auth":"$ntfy_auth","cookie":"$ntfy_cookie",'
    '"authk":"$ntfy_authk","authlook":"$ntfy_authlook","authsize":"$ntfy_authsize",'
    '"pauth":"$ntfy_pauth","pauthlook":"$ntfy_pauthlook",'
    '"cookielook":"$ntfy_cookielook","cookiesize":"$ntfy_cookiesize",'
    '"apikey":"$ntfy_apikey","xtoken":"$ntfy_xtoken","xcsrf":"$ntfy_xcsrf",'
    '"te":"$http_transfer_encoding","exp":"$http_expect","range":"$http_range",'
    '"acc":"$http_accept","enc":"$http_accept_encoding","lang":"$http_accept_language",'
    '"conn":"$http_connection","up":"$http_upgrade","via":"$http_via",'
    '"xri":"$http_x_real_ip","xfport":"$http_x_forwarded_port","xcip":"$http_client_ip",'
    '"xff2":"$http_forwarded","dnt":"$http_dnt","ctlen":"$http_content_length",'
    '"sfs":"$http_sec_fetch_site","sfm":"$http_sec_fetch_mode","sfd":"$http_sec_fetch_dest",'
    '"sfu":"$http_sec_fetch_user","chua":"$http_sec_ch_ua","chm":"$http_sec_ch_ua_mobile",'
    '"chp":"$http_sec_ch_ua_platform","xrw":"$http_x_requested_with","cc":"$http_cache_control",'
    '"pragma":"$http_pragma","ims":"$http_if_modified_since","inm":"$http_if_none_match",'
    '"hmo":"$http_x_http_method_override","xom":"$http_x_original_method",'
    '"tcip":"$http_true_client_ip","cfip":"$http_cf_connecting_ip","xhost":"$http_x_host",'
    '"xfs":"$http_x_forwarded_server","maxf":"$http_max_forwards","prio":"$http_priority",'
    '"wap":"$http_x_wap_profile","te2":"$http_te","sni":"$ssl_server_name",'
    '"rport":"$remote_port",'
    '"scheme":"$scheme","reqlen":$request_length,"ssl":"$ssl_protocol/$ssl_cipher","which":"ntfy"}';

server {
    listen      80;
    listen      [::]:80;
    server_name ntfy.falco81.net;                 # <- the ntfy name
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ntfy.falco81.net;                 # <- the ntfy name
    server_tokens off;

    # the certificate that carries THIS name - see the note at the top
    ssl_certificate           /etc/nginx/certs/ntfy.pem;
    ssl_certificate_key       /etc/nginx/certs/ntfy.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:NTFYFRONT:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    # Its own log, and its own error log. Name them under "The server that
    # faces the internet" as well if you want what happens here weighed with
    # everything else - or leave them out of it, since a phone holding a
    # subscription open all day is not a scanner and there is no sense in
    # teaching the counting otherwise.
    access_log /var/log/nginx/ntfy.log;
    error_log  /var/log/nginx/ntfy-error.log;

    # ...and the full line for anything that never reaches the location below:
    # a request turned away by the host check, or answered by the server block
    # itself. A location's own access_log replaces this one for requests that
    # do get that far, so nothing is written twice. The TLS fields are empty
    # here - nginx does not have them to hand this early - which is the price
    # of hearing about a request that was refused before it went anywhere.
    access_log /var/log/nginx/ntfy-full.log ntfyfull;

    # Asked for by the address rather than by the name: the same refusal as
    # everywhere else on this machine.
    if ($host != "ntfy.falco81.net") {            # <- the ntfy name
        return 444;
    }

    # the full line, beside the ordinary one. A subscription is held open for
    # hours and writes its line when it ends, so this file grows slowly - but
    # it holds bodies, so rotate it and keep it to root.
    location / {
        # Nothing but the four ways anybody legitimately arrives. TRACE,
        # PROPFIND, DEBUG and the rest are answered 405 without ntfy being
        # woken at all - and a 405 is weighed by the house, so a scanner
        # walking methods ends up on the list.
        limit_except GET POST PUT HEAD OPTIONS DELETE { deny all; }

        limit_req zone=ntfy_front burst=40 nodelay;
        limit_req_status 429;

        # a subscription streams, so the body is only buffered where there is
        # one to buffer: a publish. 8k covers a message; anything bigger is
        # streamed and logged as its length alone.
        client_body_buffer_size 8k;

        # In the location rather than the server block: at server level the
        # TLS fields come out empty - the line is written before nginx has
        # them to hand - and "ssl":"/" in every row is a field that says
        # nothing. Here they are filled in.
        access_log /var/log/nginx/ntfy-full.log ntfyfull;

        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;

        # A subscription is one request that never ends - held open for hours,
        # written to a line at a time. Buffering it would hold every message
        # back until nginx felt like letting go.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;

        proxy_set_header Host              $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # long enough for a subscription to sit still between messages
        proxy_connect_timeout 3m;
        proxy_send_timeout    3m;
        proxy_read_timeout    3m;

        # Attachments are off in server.yml, so nothing legitimate is bigger
        # than a message. If you ever turn them on, this is the line to raise
        # or set to 0; until then it is a megabyte nobody can stream through.
        client_max_body_size 1m;
    }
}
