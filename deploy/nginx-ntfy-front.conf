# /etc/nginx/conf.d/zigmon-ntfy.conf -- ntfy on the server that faces the
# internet, under a name of its own: https://ntfy.falco81.net
#
# WHY A NAME AND NOT A PATH
#
# ntfy serves its API and its web app from the root of whatever name it is
# given: /v1/..., /<topic>, /<topic>/ws, /docs, /static. Its own settings call
# base-url "the root URL for the ntfy server", and every example in its
# documentation is a bare hostname. Under a path prefix - /ntfy - the web app
# asks for /static rather than /ntfy/static, the websocket opens on
# /<topic>/ws, and the attachment and e-mail links it writes point at
# addresses that are not there. It half-works, which is worse than not
# working, because it fails later and somewhere else.
#
# So it gets a name. The one-tap road keeps mqtt.falco81.net; this is a second
# server block on the same 443, chosen by the name in the request.
#
# BEFORE NGINX WILL START
#
#   1. a DNS record, pointing at the same address as mqtt.falco81.net:
#
#          ntfy.falco81.net.   A     <this machine>
#          ntfy.falco81.net.   AAAA  <this machine, if it has one>
#
#   2. a certificate that carries the name. Three ways, in order of how much
#      work they are:
#
#      - one certificate for both names. With Let's Encrypt:
#
#            certbot certonly --nginx -d mqtt.falco81.net -d ntfy.falco81.net
#
#        and point both server blocks at the same fullchain.pem/privkey.pem.
#
#      - a wildcard, *.falco81.net, which covers anything else later too.
#
#      - a second certificate of its own, named in this file alone. That is
#        what the paths below assume: /etc/nginx/certs/ntfy.{pem,key}.
#
#      Check before reloading, or nginx will start and every phone will
#      refuse the handshake without saying why:
#
#          openssl x509 -in /etc/nginx/certs/ntfy.pem -noout -text \
#              | grep -A 1 "Subject Alternative Name"
#
#   3. this block must NOT be the default one. The default on 443 is the block
#      that refuses everything it does not know, in nginx-tap-front.conf, and
#      it stays that way: a request for a third name still gets nothing.
#
# ON THE NTFY SIDE, /etc/ntfy/server.yml:
#
#     base-url: "https://ntfy.falco81.net"
#     listen-http: "127.0.0.1:2586"
#     behind-proxy: true
#     cache-file: "/var/cache/ntfy/cache.db"
#     attachment-cache-dir: "/var/cache/ntfy/attachments"
#
# listen-http on 127.0.0.1 is what stops it fighting nginx for port 80:
# nothing but this machine can reach it, and nginx is the only thing that
# does. behind-proxy makes it believe the X-Forwarded-For below, so its own
# rate limiting counts the caller rather than counting nginx.
#
#     systemctl restart ntfy && ss -lntp | grep 2586
#
# ON THIS MACHINE, IN ORDER
#
#   1. this file into /etc/nginx/conf.d/zigmon-ntfy.conf, with the hostname
#      and the certificate paths made your own
#
#   2. nothing to open in the firewall: 443 is already through it, and this
#      block is another name on the same port.
#
#   3. SELinux let nginx talk to a local port at all. On RHEL and its family
#      this is the one that bites: nginx starts, the port answers, and every
#      request is 502 with "Permission denied ... connect()" in the error log.
#
#          setsebool -P httpd_can_network_connect 1
#
#   4. nginx -t && systemctl reload nginx
#
#   5. and a look, from another machine:
#
#          curl -sS -d "hello" https://ntfy.falco81.net/zigmon-house
#          curl -sS https://ntfy.falco81.net/zigmon-house/json?poll=1
#
#      The first should answer with the message as JSON; the second should
#      hand it straight back. If the first hangs, it is the buffering; if it
#      is 502, it is step 3.
#
# SHUTTING IT PROPERLY
#
# An ntfy with no accounts lets anybody who learns a topic name read it and
# write to it - the same bargain as ntfy.sh, where the topic name is the whole
# of the secret. On a server of your own that is a poor trade, since the name
# travels in every URL and sits in nginx's log. The whole of it, in order:
#
#   1. nothing anonymous, at all. In /etc/ntfy/server.yml:
#
#          auth-file: "/var/lib/ntfy/user.db"
#          auth-default-access: "deny-all"
#
#      Then every request, read or write, has to say who it is.
#
#   2. two users, because the daemon and the phone want different things.
#      The daemon only ever publishes; the phone only ever reads:
#
#          ntfy user add zigmon                  # a plain user
#          ntfy user add falco                   # you, on the phone
#          ntfy access zigmon 'zigmon-*' write   # publish, never read
#          ntfy access falco  'zigmon-*' read    # read, never publish
#
#      A daemon that cannot read cannot be made to hand your notifications
#      back, and a phone that cannot write cannot be used to send a fake one.
#      Make yourself an admin instead if you would rather manage it from the
#      web app: ntfy user add --role=admin falco.
#
#   3. tokens rather than passwords, so what is written into a config file is
#      not the password to the account:
#
#          ntfy token add --label="the house" zigmon
#          ntfy token add --label="my phone"   falco
#
#      In zigmon the token goes in the URL as the password of a blank user:
#
#          https://:tk_...@ntfy.falco81.net/zigmon-house
#
#      In the phone app, Settings -> Add server -> the same address, and the
#      token under "Access tokens".
#
#   4. nothing to sign up for and, if you never use it, no web app at all:
#
#          enable-signup: false
#          enable-reservations: false
#          enable-login: true        # the phone app logs in; false if it uses
#                                    # a token only, which is quieter still
#          web-root: "disable"       # no web app, no /static, no login page
#
#      web-root: disable leaves the API and nothing else. It is the single
#      biggest cut in what is reachable, and costs nothing if the phone is
#      how you read these.
#
#   5. attachments off unless they are wanted. Leaving attachment-cache-dir
#      unset is how: no upload road, no disk to fill.
#
#   6. limits, since a token can leak too:
#
#          visitor-request-limit-burst: 20
#          visitor-message-daily-limit: 500
#
#   7. and the same log read by the house. Name /var/log/nginx/ntfy-error.log
#      under "The server that faces the internet" -> "And its error log" and
#      somebody guessing tokens is weighed and kept out with everybody else.
#
# What that leaves reachable from the internet: a POST with a token to one
# topic pattern, a GET with a token to the same, and 401 for everything else.
#
# IN ZIGMON
#
# Control -> Alerts -> Notification channels -> ntfy topic URL:
#
#     https://ntfy.falco81.net/zigmon-house
#
# and subscribe the phone app to the same address (Settings -> Add server).

# A minute's worth at two a second, forty allowed to arrive at once. A phone
# opening a subscription uses one and then sits still; something working
# through a list of tokens runs dry in forty and is answered 429 from then on,
# which the house reads out of the log below and weighs.
limit_req_zone $binary_remote_addr zone=ntfy_front:1m rate=120r/m;

# Port 80 for this name. The default block on 80 closes anything it does not
# know, which would include this - and a certificate cannot be issued over a
# door that does not open: certbot's HTTP-01 challenge is answered on 80, by
# name. So the name gets a block there too, which does nothing but send
# everybody to HTTPS.
# The same full line as the one-tap road has, under a name of its own -
# log_format is declared once for the whole of nginx, so two files cannot both
# call it tapfull. Same fields, same reasons: JSON with escape=json so a body
# with newlines in it stays one line, and no Authorization value, because that
# is the token the phone holds and this file is copied to the house.
map $http_authorization $ntfy_auth {
    ""      "none";
    default "sent";
}
# ...and the same for a cookie, which was written down as it came
map $http_cookie $ntfy_cookie {
    ""      "none";
    default "sent";
}

log_format ntfyfull escape=json
    '{"ip":"$remote_addr","t":"$time_iso8601","m":"$request_method","u":"$request_uri",'
    '"proto":"$server_protocol","s":$status,"bytes":$body_bytes_sent,"took":$request_time,'
    '"host":"$http_host","ua":"$http_user_agent","ref":"$http_referer",'
    '"ct":"$content_type","clen":"$content_length","body":"$request_body",'
    '"secret":"$ntfy_auth","code":"none","xff":"$http_x_forwarded_for",'
    '"xfh":"$http_x_forwarded_host","xou":"$http_x_original_url",'
    '"xru":"$http_x_rewrite_url","xfp":"$http_x_forwarded_proto",'
    '"origin":"$http_origin","auth":"$ntfy_auth","cookie":"$ntfy_cookie",'
    '"te":"$http_transfer_encoding","exp":"$http_expect","range":"$http_range",'
    '"acc":"$http_accept","enc":"$http_accept_encoding","lang":"$http_accept_language",'
    '"conn":"$http_connection","up":"$http_upgrade","via":"$http_via",'
    '"xri":"$http_x_real_ip","xfport":"$http_x_forwarded_port","xcip":"$http_client_ip",'
    '"xff2":"$http_forwarded","dnt":"$http_dnt","ctlen":"$http_content_length",'
    '"scheme":"$scheme","reqlen":$request_length,"ssl":"$ssl_protocol/$ssl_cipher",'
    '"which":"ntfy"}';

server {
    listen      80;
    listen      [::]:80;
    server_name ntfy.falco81.net;                 # <- the ntfy name
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ntfy.falco81.net;                 # <- the ntfy name
    server_tokens off;

    # the certificate that carries THIS name - see the note at the top
    ssl_certificate           /etc/nginx/certs/ntfy.pem;
    ssl_certificate_key       /etc/nginx/certs/ntfy.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:NTFYFRONT:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;

    # Its own log, and its own error log. Name them under "The server that
    # faces the internet" as well if you want what happens here weighed with
    # everything else - or leave them out of it, since a phone holding a
    # subscription open all day is not a scanner and there is no sense in
    # teaching the counting otherwise.
    access_log /var/log/nginx/ntfy.log;
    error_log  /var/log/nginx/ntfy-error.log;

    # ...and the full line for anything that never reaches the location below:
    # a request turned away by the host check, or answered by the server block
    # itself. A location's own access_log replaces this one for requests that
    # do get that far, so nothing is written twice. The TLS fields are empty
    # here - nginx does not have them to hand this early - which is the price
    # of hearing about a request that was refused before it went anywhere.
    access_log /var/log/nginx/ntfy-full.log ntfyfull;

    # Asked for by the address rather than by the name: the same refusal as
    # everywhere else on this machine.
    if ($host != "ntfy.falco81.net") {            # <- the ntfy name
        return 444;
    }

    # the full line, beside the ordinary one. A subscription is held open for
    # hours and writes its line when it ends, so this file grows slowly - but
    # it holds bodies, so rotate it and keep it to root.
    location / {
        # Nothing but the four ways anybody legitimately arrives. TRACE,
        # PROPFIND, DEBUG and the rest are answered 405 without ntfy being
        # woken at all - and a 405 is weighed by the house, so a scanner
        # walking methods ends up on the list.
        limit_except GET POST PUT HEAD OPTIONS DELETE { deny all; }

        limit_req zone=ntfy_front burst=40 nodelay;
        limit_req_status 429;

        # a subscription streams, so the body is only buffered where there is
        # one to buffer: a publish. 8k covers a message; anything bigger is
        # streamed and logged as its length alone.
        client_body_buffer_size 8k;

        # In the location rather than the server block: at server level the
        # TLS fields come out empty - the line is written before nginx has
        # them to hand - and "ssl":"/" in every row is a field that says
        # nothing. Here they are filled in.
        access_log /var/log/nginx/ntfy-full.log ntfyfull;

        proxy_pass http://127.0.0.1:2586;
        proxy_http_version 1.1;

        # A subscription is one request that never ends - held open for hours,
        # written to a line at a time. Buffering it would hold every message
        # back until nginx felt like letting go.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;

        proxy_set_header Host              $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # long enough for a subscription to sit still between messages
        proxy_connect_timeout 3m;
        proxy_send_timeout    3m;
        proxy_read_timeout    3m;

        # Attachments are off in server.yml, so nothing legitimate is bigger
        # than a message. If you ever turn them on, this is the line to raise
        # or set to 0; until then it is a megabyte nobody can stream through.
        client_max_body_size 1m;
    }
}
