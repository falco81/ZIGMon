    "~*\\.\\./|\\.\\.\\\\|\\.\\.%2f|%2e%2e|/etc/passwd|win\\.ini"  "traversal";
    "~*\\(\\)\\s*\\{\\s*:\\s*;\\s*\\}|\\$\\(|`|;\\s*(?:wget|curl|bash|sh|nc|id)(?=[\\s;|&`)#]|$)|\\|\\s*(?:sh|bash)\\b|/bin/(?:sh|bash)|cmd\\.exe|powershell"  "shell";
