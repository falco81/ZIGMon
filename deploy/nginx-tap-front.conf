# /etc/nginx/conf.d/zigmon-tap.conf  -- on the server that faces the internet
#
# This exposes ONE address and nothing else: the header road for the one-tap
# links. The dashboard, the API, the status, the events - none of them are
# reachable through this server, because none of them are written here. A
# location that is not in this file cannot be reached by forgetting a rule.
#
# What travels: a POST carrying X-Zigmon-Tap (the link's own secret) and, when
# a second factor is asked for, X-Zigmon-Code. Nothing of either is in an
# address, so nothing of either is in this server's access log.
#
# Before using it, on the HOME server, do two things.
#
# In its zigmon nginx file, let this server at the /tap locations and at
# nothing else - the rules go inside those locations, where they replace the
# ones at the top of the server rather than adding to them:
#
#     allow <the address of this front server>;
#
# Do NOT add set_real_ip_from there. It is the obvious thing to reach for and
# it undoes the line above: real_ip rewrites the address before the access
# rules are read, so the connection stops being this server and becomes
# whoever pressed, and the allow rule then matches nothing at all. The log
# will show the real addresses and every press will be refused.
#
# Instead, in Settings -> Keeping addresses out, write this server's address
# under trusted_proxies. The daemon then believes the X-Forwarded-For it
# carries - and only from an address written there - so the press list, the
# log and the counting all name the phone that pressed rather than this
# proxy. Without it, one guesser shuts the links for the whole house.
#
# If this nginx serves other sites as well, the cipher list above applies to
# this server block only; the others keep whatever they had. Setting it once at
# the http level covers the whole machine, which is usually what is wanted.
#
# This file answers to the name and to nothing else: a request to the bare
# address is refused at the handshake, before a certificate is offered. If you
# reach the machine by address for anything of your own, that is what the
# refusal is - name it in a server block of its own rather than removing the
# default one.
#
# And set the links to "opened by a header only" in Settings -> One-tap links.
# While the address form is still accepted, the secret travels in a URL, which
# this server's log, any proxy in front of it and every browser history keep.

# A minute's worth at one a second, twenty allowed to arrive at once. A person
# pressing a link never notices it; a machine working through a list is
# answered 429 without anything behind this server being woken.
limit_req_zone $binary_remote_addr zone=tap_front:1m rate=60r/m;

# Anything that does not ask for the name by name. A server block is chosen
# by the Host header, and whatever is left over goes to the default one - so
# with only the real block here, https://<this machine's address>/tap was the
# real block, and every scanner that walks addresses rather than names found
# the road. These two catch that instead.
#
# ssl_reject_handshake refuses the TLS handshake outright when the SNI is not
# a name this server knows: no certificate is offered, nothing is logged as a
# request, and a scanner learns nothing at all. It wants nginx 1.19.4 or
# newer; on anything older, drop that line and give this block the same
# certificate with `return 444;`, which answers by closing the connection.
# Two ways to do this, and which you want depends on whether you would rather
# the scanners were invisible or were counted.
#
#   ssl_reject_handshake on;
#       The quietest. No certificate is offered and nothing reaches the log,
#       so nobody learns anything - and neither does the blacklist, which
#       cannot weigh a line that was never written.
#
#   a certificate and `return 444;`   <- what is written below
#       The connection is closed without a word, exactly as quietly from the
#       caller's side, but nginx writes the line first. zigmon reads 444 in
#       this log as "asked for the machine by its address, not by its name",
#       weighs it, and the address ends up on the list with everything else
#       it has been doing. A scanner that walks addresses is counted rather
#       than merely ignored.
# Everything, as one line of JSON per request: the body, every header worth
# naming, the times and the sizes. JSON because a scanner puts newlines and
# quotes in a body on purpose, and escape=json makes one request stay one
# line - without it a crafted body writes a second line of its own and says
# whatever it likes about whoever it likes.
#
# THE ONE THING THAT IS NOT WRITTEN DOWN is the link's own secret and the
# second-factor code: this log lives on the machine the internet is knocking
# at, and it is copied to the house over SSH and kept in a database there, so
# a value in it exists in two more places than it did. What is written is
# whether it was there at all, which is what the weighing actually asks.
map $http_x_zigmon_tap $tap_secret {
    ""      "none";
    default "sent";
}
# IF YOU WANT THE VALUES THEMSELVES, this is the line to change: replace the
# map above with
#
#     map $http_x_zigmon_tap $tap_secret { default $http_x_zigmon_tap; }
#
# and the same for the code below. What that changes, so it is a decision and
# not a surprise:
#
#   - Anybody who reads this file can press every link in it. If every link
#     asks for Duo or a code, that is not the house being opened - it is a
#     push at your phone at three in the morning, again and again, until
#     somebody taps approve to make it stop. That attack has a name and it
#     works on people who know better.
#   - A link with no second factor - one that only tells you something - acts
#     on the secret alone, and those are exactly the ones nobody thinks about.
#   - The file lives on the machine the internet knocks at, and a copy of
#     every line is kept in the database at home. One value becomes three.
#
# What it buys: nothing the weighing uses. Every rule asks whether a secret
# was there, not which one. It is worth turning on to answer one question -
# "is somebody pressing a link I thought I had rotated" - and worth turning
# off again afterwards.
map $http_x_zigmon_code $tap_code {
    ""      "none";
    default "sent";
}

# Whether a credential was sent, never the credential: this file is copied
# to the house and read by a program, and an Authorization or a Cookie header
# is somebody's key whoever sent it.
map $http_authorization $tap_auth {
    ""      "none";
    default "sent";
}
map $http_cookie $tap_cookie {
    ""      "none";
    default "sent";
}

log_format tapfull escape=json
    '{"ip":"$remote_addr","t":"$time_iso8601","m":"$request_method","u":"$request_uri",'
    '"proto":"$server_protocol","s":$status,"bytes":$body_bytes_sent,"took":$request_time,'
    '"host":"$http_host","ua":"$http_user_agent","ref":"$http_referer",'
    '"ct":"$content_type","clen":"$content_length","body":"$request_body",'
    '"secret":"$tap_secret","code":"$tap_code","xff":"$http_x_forwarded_for",'
    '"xfh":"$http_x_forwarded_host","xou":"$http_x_original_url",'
    '"xru":"$http_x_rewrite_url","xfp":"$http_x_forwarded_proto",'
    '"origin":"$http_origin","auth":"$tap_auth","cookie":"$tap_cookie",'
    '"te":"$http_transfer_encoding","exp":"$http_expect","range":"$http_range",'
    '"acc":"$http_accept","enc":"$http_accept_encoding","lang":"$http_accept_language",'
    '"conn":"$http_connection","up":"$http_upgrade","via":"$http_via",'
    '"xri":"$http_x_real_ip","xfport":"$http_x_forwarded_port","xcip":"$http_client_ip",'
    '"xff2":"$http_forwarded","dnt":"$http_dnt","ctlen":"$http_content_length",'
    '"scheme":"$scheme","reqlen":$request_length,"ssl":"$ssl_protocol/$ssl_cipher"}';

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # the same log the daemon reads, so what lands here is weighed
    access_log /var/log/nginx/zigmon-tap.log;
    # ...and the whole of every request, whatever it asks for. Not only the
    # one road: a scanner never touches /tap, and a scanner is the thing
    # worth learning from. A refused request carries no body here - nginx
    # does not read one it is not going to pass anywhere - so bodies appear
    # for the tap road and nothing else, which is the honest half of it.
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;

    return 444;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/zigmon-tap.log;     # counted, like the rest
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;
    return 444;                                   # close it without a word
}

server {
    listen      80;
    listen      [::]:80;
    server_name mqtt.falco81.net;                 # <- your hostname
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name mqtt.falco81.net;                 # <- your hostname
    server_tokens off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    # Named here rather than left to nginx. Its default list - HIGH:!aNULL:!MD5
    # - still offers the TLS_RSA suites, where the key exchange is the server's
    # own RSA key and there is no forward secrecy at all: record the traffic
    # today, take the key some other day, read it. Qualys marks each of them
    # WEAK and caps the whole server at B for it. These are the same ECDHE-only
    # suites the home server uses, and they leave TLS 1.3's own alone.
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:TAPFRONT:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # a stapled answer saves every visitor a trip to the CA. Harmless where
    # the CA offers no responder: nginx logs a warning at start and staples
    # nothing. server.ca is the chain, the same file the home server names.
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/nginx/certs/server.ca;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    access_log /var/log/nginx/zigmon-tap.log;
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;
    error_log  /var/log/nginx/zigmon-tap-error.log;

    # ...and one more time inside the block, for the case the two above
    # cannot cover: a request that arrived with the right SNI and a different
    # Host header. The TLS name and the Host are chosen separately by whoever
    # is asking, and only this compares them.
    if ($host != "mqtt.falco81.net") {            # <- your hostname
        return 444;
    }

    # ---- the one shape PHP itself is broken by ---------------------------
    # php2shell, 21 October 2026: CVE-2026-109618 and CVE-2026-109619, both
    # 9.2. This server has no PHP of its own, but the one address it does
    # carry is handed to the home server and ends at php-fpm - and that hole
    # is reached before any page of the dashboard runs, so nothing behind
    # here can stop it. The home nginx refuses the shape as well; this is
    # the first of the two places, and the one facing the internet.
    #
    # Nothing that legitimately presses a one-tap link sends a multipart
    # body: the road takes JSON and four kilobytes of it. So this refuses
    # only callers who had no business here.
    #
    # Measured, in this server's own log: on 21 October 2026 at 00:36:18 one
    # address sent eight of these in the same second - POST to /, /login,
    # /_next and /api, twice over, 131,874 bytes apiece - the day the holes
    # were published. Nothing of them reached PHP, because this server
    # answers 404 for every address but one; the day somebody aims the same
    # thing at /tap instead, this line is what is between it and php-fpm.
    if ($http_content_type ~* "^multipart/") { return 444; }

    # Everything that is not the one address is not here.
    location / { return 404; }

    location = /tap {
        # the body is read before the log line is written, so $request_body
        # holds something - without this it is empty for every request
        client_body_buffer_size 8k;
        client_body_in_single_buffer on;

        limit_req zone=tap_front burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        client_body_timeout 10s;

        # Nothing but the status. It used to answer a little JSON error that
        # named the header this road takes - which tells somebody who was only
        # guessing that there is something here worth guessing at, and names
        # the very thing they would need. An empty 405 says only that the
        # method was wrong, which whoever sent it already knows.
        if ($request_method != POST) {
            return 405 "";
        }

        # The press is in its headers and its body; nothing it needs is in
        # the query, and the query is what once carried "api=status" through
        # to the whole of the home server's API. It does not leave here.
        set $args "";

        # The home server. Over a private link - WireGuard between the two
        # machines, or a route only this server has - so the dashboard is not
        # reachable from the internet by finding its address.
        proxy_pass https://192.168.40.233/tap;               # <- the home server
        # The name, not the address, in both the SNI and the Host: the home
        # nginx picks its server block by the Host header, and one that does
        # not match lands in whichever block is the default - which is not
        # necessarily the dashboard's. Its certificate is for the name too, so
        # the same word makes the handshake verifiable.
        proxy_ssl_server_name on;
        proxy_ssl_name                    mqtt.falco81.net;
        proxy_set_header Host             mqtt.falco81.net;    # <- the home vhost's name
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # A press that somebody has to approve is answered when they do, which
        # is a minute away; the daemon gives up before this does.
        # nginx does not check the home server's certificate unless it is told
        # to. Over a private link between two machines you own that is a
        # reasonable place to stop; to check it, name the CA and turn it on:
        #
        #     proxy_ssl_trusted_certificate /etc/nginx/certs/server.ca;
        #     proxy_ssl_verify on;
        #     proxy_ssl_verify_depth 3;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
