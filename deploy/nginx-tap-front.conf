    "Basic bXF0dDptcXR0"  "mqtt:mqtt";
    "Basic bnRmeTpudGZ5"  "ntfy:ntfy";
}
map $http_authorization $tap_authlook {
    default "";
    "~*\\$\\{(?:jndi|env|sys|lower|upper|\\$\\{)|JHtqbmRp"  "jndi";
    "~*union(?:\\s|\\+|%20|/\\*.*?\\*/)+(?:all(?:\\s|\\+|%20)+)?select|'\\s*or\\s+'?1'?\\s*=\\s*'?1|\\bor\\s+1=1\\b|sleep\\(\\s*\\d|benchmark\\(|waitfor\\s+delay"  "sqli";
    "~*<script|javascript:|onerror\\s*=|onload\\s*="  "xss";
    "~*\\.\\./|\\.\\.\\\\|\\.\\.%2f|%2e%2e|/etc/passwd|win\\.ini"  "traversal";
    "~*\\(\\)\\s*\\{\\s*:\\s*;\\s*\\}|\\$\\(|`|;\\s*(?:wget|curl|bash|sh|nc|id)(?=[\\s;|&`)#]|$)|\\|\\s*(?:sh|bash)\\b|/bin/(?:sh|bash)|cmd\\.exe|powershell"  "shell";
    "~\\{\\{.*?\\}\\}|\\$\\{[^}]{0,80}\\}|#\\{[^}]{0,80}\\}|<%="  "template";
    "~^.{4097}"  "huge";
}
map $http_proxy_authorization $tap_pauthlook {
    default "";
    "~*\\$\\{(?:jndi|env|sys|lower|upper|\\$\\{)|JHtqbmRp"  "jndi";
    "~*union(?:\\s|\\+|%20|/\\*.*?\\*/)+(?:all(?:\\s|\\+|%20)+)?select|'\\s*or\\s+'?1'?\\s*=\\s*'?1|\\bor\\s+1=1\\b|sleep\\(\\s*\\d|benchmark\\(|waitfor\\s+delay"  "sqli";
    "~*<script|javascript:|onerror\\s*=|onload\\s*="  "xss";
    "~*\\.\\./|\\.\\.\\\\|\\.\\.%2f|%2e%2e|/etc/passwd|win\\.ini"  "traversal";
    "~*\\(\\)\\s*\\{\\s*:\\s*;\\s*\\}|\\$\\(|`|;\\s*(?:wget|curl|bash|sh|nc|id)(?=[\\s;|&`)#]|$)|\\|\\s*(?:sh|bash)\\b|/bin/(?:sh|bash)|cmd\\.exe|powershell"  "shell";
    "~\\{\\{.*?\\}\\}|\\$\\{[^}]{0,80}\\}|#\\{[^}]{0,80}\\}|<%="  "template";
    "~^.{4097}"  "huge";
}
map $http_cookie $tap_cookielook {
    default "";
    "~*\\$\\{(?:jndi|env|sys|lower|upper|\\$\\{)|JHtqbmRp"  "jndi";
    "~*union(?:\\s|\\+|%20|/\\*.*?\\*/)+(?:all(?:\\s|\\+|%20)+)?select|'\\s*or\\s+'?1'?\\s*=\\s*'?1|\\bor\\s+1=1\\b|sleep\\(\\s*\\d|benchmark\\(|waitfor\\s+delay"  "sqli";
    "~*<script|javascript:|onerror\\s*=|onload\\s*="  "xss";
    "~*\\.\\./|\\.\\.\\\\|\\.\\.%2f|%2e%2e|/etc/passwd|win\\.ini"  "traversal";
    "~*\\(\\)\\s*\\{\\s*:\\s*;\\s*\\}|\\$\\(|`|;\\s*(?:wget|curl|bash|sh|nc|id)(?=[\\s;|&`)#]|$)|\\|\\s*(?:sh|bash)\\b|/bin/(?:sh|bash)|cmd\\.exe|powershell"  "shell";
    "~\\{\\{.*?\\}\\}|\\$\\{[^}]{0,80}\\}|#\\{[^}]{0,80}\\}|<%="  "template";
    "~^.{4097}"  "huge";
}
map $http_authorization $tap_authsize {
    ""  "";
    "~^.{0,32}$"  "s";
    "~^.{33,256}$"  "m";
    "~^.{257,2048}$"  "l";
    default "xl";
}
map $http_cookie $tap_cookiesize {
    ""  "";
    "~^.{0,32}$"  "s";
    "~^.{33,256}$"  "m";
    "~^.{257,2048}$"  "l";
    default "xl";
}
map $http_proxy_authorization $tap_pauth {
    ""  "none";
    "~^(?<tapps>[A-Za-z][A-Za-z0-9_-]{0,19})\\s"  "$tapps *";
    default "*";
}
map $http_cookie $tap_cookie {
    ""  "none";
    "~^\\s*(?<tapc1>[^=;\\s]{1,40})=[^;]*(?:;\\s*(?<tapc2>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc3>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc4>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc5>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc6>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc7>[^=;\\s]{1,40})=[^;]*)?(?:;\\s*(?<tapc8>[^=;\\s]{1,40})=[^;]*)?(?:(?<tapcm>;).*)?$"  "names: $tapc1 $tapc2 $tapc3 $tapc4 $tapc5 $tapc6 $tapc7 $tapc8 $tapcm";
    default "odd";
}
map $http_x_zigmon_tap $tap_secret {
    ""  "none";
    "~^\\S{10,}(?<tapkd>\\S\\S)\\s*$"  "*$tapkd";
    default "*";
}
map $http_x_api_key $tap_apikey {
    ""  "none";
    "~^\\S{10,}(?<tapka>\\S\\S)\\s*$"  "*$tapka";
    default "*";
}
map $http_x_auth_token $tap_xtoken {
    ""  "none";
    "~^\\S{10,}(?<tapkb>\\S\\S)\\s*$"  "*$tapkb";
    default "*";
}
map $http_x_csrf_token $tap_xcsrf {
    ""  "none";
    "~^\\S{10,}(?<tapkc>\\S\\S)\\s*$"  "*$tapkc";
    default "*";
}
map $request_body $tap_body1 {
    "~*^(?<tapy1a>(?:.*?[&?;{,\\s\"\\'])?\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapy1b>.*)$"  "$tapy1a*$tapy1b";
    default $request_body;
}
map $tap_body1 $tap_body2 {
    "~*^(?<tapy2a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapy2b>.*)$"  "$tapy2a*$tapy2b";
    default $tap_body1;
}
map $tap_body2 $tap_body3 {
    "~*^(?<tapy3a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapy3b>.*)$"  "$tapy3a*$tapy3b";
    default $tap_body2;
}
map $tap_body3 $tap_body {
    "~*^(?<tapy4a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapy4b>.*)$"  "$tapy4a*$tapy4b";
    default $tap_body3;
}
map $request_uri $tap_uri0 {
    "~^(?<taput0>/(?:api/)?tap/)[^/?#]+(?<taput1>.*)$"  "$taput0*$taput1";
    default $request_uri;
}
map $tap_uri0 $tap_uri1 {
    "~*^(?<tapu1a>(?:.*?[&?;{,\\s\"\\'])?\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapu1b>.*)$"  "$tapu1a*$tapu1b";
    default $tap_uri0;
}
map $tap_uri1 $tap_uri2 {
    "~*^(?<tapu2a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapu2b>.*)$"  "$tapu2a*$tapu2b";
    default $tap_uri1;
}
map $tap_uri2 $tap_uri {
    "~*^(?<tapu3a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapu3b>.*)$"  "$tapu3a*$tapu3b";
    default $tap_uri2;
}
# (pass 3) a link's secret in a whole address, as a Referer carries it: a
# browser that opened /tap/<secret> names it in what it asks for next
map $http_referer $tap_ref0 {
    "~^(?<taprf0>(?:[A-Za-z][A-Za-z0-9+.-]{0,15}://[^/?#\\s]{0,255})?/(?:api/)?tap/)[^/?#]+(?<taprf1>.*)$"  "$taprf0*$taprf1";
    default $http_referer;
}
map $tap_ref0 $tap_ref1 {
    "~*^(?<tapr1a>(?:.*?[&?;{,\\s\"\\'])?\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapr1b>.*)$"  "$tapr1a*$tapr1b";
    default $tap_ref0;
}
map $tap_ref1 $tap_ref {
    "~*^(?<tapr2a>.*[&?;{,\\s\"\\']\"?(?:pass(?:word|wd)?|pwd|passcode|pin|otp|token|secret|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|auth|session|sessionid|sid|code|key)\"?\\s*[:=]\\s*\"?)(?:(?<=\")(?!\\*)(?:[^\"\\\\]|\\\\.)+|[^&\"\\',}\\s*]+)(?<tapr2b>.*)$"  "$tapr2a*$tapr2b";
    default $tap_ref1;
}

log_format tapfull escape=json
    '{"ip":"$remote_addr","t":"$time_iso8601","m":"$request_method","u":"$tap_uri",'
    '"proto":"$server_protocol","s":$status,"bytes":$body_bytes_sent,"took":$request_time,'
    '"host":"$http_host","ua":"$http_user_agent","ref":"$tap_ref",'
    '"ct":"$content_type","clen":"$content_length","body":"$tap_body",'
    '"secret":"$tap_secret","code":"$tap_code",'
    '"xff":"$http_x_forwarded_for",'
    '"xfh":"$http_x_forwarded_host","xou":"$http_x_original_url",'
    '"xru":"$http_x_rewrite_url","xfp":"$http_x_forwarded_proto",'
    '"origin":"$http_origin","auth":"$tap_auth","cookie":"$tap_cookie",'
    '"authk":"$tap_authk","authlook":"$tap_authlook","authsize":"$tap_authsize",'
    '"pauth":"$tap_pauth","pauthlook":"$tap_pauthlook",'
    '"cookielook":"$tap_cookielook","cookiesize":"$tap_cookiesize",'
    '"apikey":"$tap_apikey","xtoken":"$tap_xtoken","xcsrf":"$tap_xcsrf",'
    '"te":"$http_transfer_encoding","exp":"$http_expect","range":"$http_range",'
    '"acc":"$http_accept","enc":"$http_accept_encoding","lang":"$http_accept_language",'
    '"conn":"$http_connection","up":"$http_upgrade","via":"$http_via",'
    '"xri":"$http_x_real_ip","xfport":"$http_x_forwarded_port","xcip":"$http_client_ip",'
    '"xff2":"$http_forwarded","dnt":"$http_dnt","ctlen":"$http_content_length",'
    '"sfs":"$http_sec_fetch_site","sfm":"$http_sec_fetch_mode","sfd":"$http_sec_fetch_dest",'
    '"sfu":"$http_sec_fetch_user","chua":"$http_sec_ch_ua","chm":"$http_sec_ch_ua_mobile",'
    '"chp":"$http_sec_ch_ua_platform","xrw":"$http_x_requested_with","cc":"$http_cache_control",'
    '"pragma":"$http_pragma","ims":"$http_if_modified_since","inm":"$http_if_none_match",'
    '"hmo":"$http_x_http_method_override","xom":"$http_x_original_method",'
    '"tcip":"$http_true_client_ip","cfip":"$http_cf_connecting_ip","xhost":"$http_x_host",'
    '"xfs":"$http_x_forwarded_server","maxf":"$http_max_forwards","prio":"$http_priority",'
    '"wap":"$http_x_wap_profile","te2":"$http_te","sni":"$ssl_server_name",'
    '"rport":"$remote_port",'
    '"scheme":"$scheme","reqlen":$request_length,"ssl":"$ssl_protocol/$ssl_cipher"}';

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # the same log the daemon reads, so what lands here is weighed
    access_log /var/log/nginx/zigmon-tap.log;
    # ...and the whole of every request, whatever it asks for. Not only the
    # one road: a scanner never touches /tap, and a scanner is the thing
    # worth learning from. A refused request carries no body here - nginx
    # does not read one it is not going to pass anywhere - so bodies appear
    # for the tap road and nothing else, which is the honest half of it.
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;

    return 444;
}

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/zigmon-tap.log;     # counted, like the rest
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;
    return 444;                                   # close it without a word
}

server {
    listen      80;
    listen      [::]:80;
    server_name mqtt.falco81.net;                 # <- your hostname
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name mqtt.falco81.net;                 # <- your hostname
    server_tokens off;

    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_protocols             TLSv1.2 TLSv1.3;
    # Named here rather than left to nginx. Its default list - HIGH:!aNULL:!MD5
    # - still offers the TLS_RSA suites, where the key exchange is the server's
    # own RSA key and there is no forward secrecy at all: record the traffic
    # today, take the key some other day, read it. Qualys marks each of them
    # WEAK and caps the whole server at B for it. These are the same ECDHE-only
    # suites the home server uses, and they leave TLS 1.3's own alone.
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:TAPFRONT:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    # a stapled answer saves every visitor a trip to the CA. Harmless where
    # the CA offers no responder: nginx logs a warning at start and staples
    # nothing. server.ca is the chain, the same file the home server names.
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/nginx/certs/server.ca;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    access_log /var/log/nginx/zigmon-tap.log;
    access_log /var/log/nginx/zigmon-tap-full.log tapfull;
    error_log  /var/log/nginx/zigmon-tap-error.log;

    # ...and one more time inside the block, for the case the two above
    # cannot cover: a request that arrived with the right SNI and a different
    # Host header. The TLS name and the Host are chosen separately by whoever
    # is asking, and only this compares them.
    if ($host != "mqtt.falco81.net") {            # <- your hostname
        return 444;
    }

    # ---- the one shape PHP itself is broken by ---------------------------
    # php2shell, 21 October 2026: CVE-2026-109618 and CVE-2026-109619, both
    # 9.2. This server has no PHP of its own, but the one address it does
    # carry is handed to the home server and ends at php-fpm - and that hole
    # is reached before any page of the dashboard runs, so nothing behind
    # here can stop it. The home nginx refuses the shape as well; this is
    # the first of the two places, and the one facing the internet.
    #
    # Nothing that legitimately presses a one-tap link sends a multipart
    # body: the road takes JSON and four kilobytes of it. So this refuses
    # only callers who had no business here.
    #
    # Measured, in this server's own log: on 21 October 2026 at 00:36:18 one
    # address sent eight of these in the same second - POST to /, /login,
    # /_next and /api, twice over, 131,874 bytes apiece - the day the holes
    # were published. Nothing of them reached PHP, because this server
    # answers 404 for every address but one; the day somebody aims the same
    # thing at /tap instead, this line is what is between it and php-fpm.
    if ($http_content_type ~* "^multipart/") { return 444; }

    # Everything that is not the one address is not here.
    location / { return 404; }

    location = /tap {
        # the body is read before the log line is written, so $request_body
        # holds something - without this it is empty for every request
        client_body_buffer_size 8k;
        client_body_in_single_buffer on;

        limit_req zone=tap_front burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        client_body_timeout 10s;

        # Nothing but the status. It used to answer a little JSON error that
        # named the header this road takes - which tells somebody who was only
        # guessing that there is something here worth guessing at, and names
        # the very thing they would need. An empty 405 says only that the
        # method was wrong, which whoever sent it already knows.
        if ($request_method != POST) {
            return 405 "";
        }

        # The press is in its headers and its body; nothing it needs is in
        # the query, and the query is what once carried "api=status" through
        # to the whole of the home server's API. It does not leave here.
        set $args "";

        # The home server. Over a private link - WireGuard between the two
        # machines, or a route only this server has - so the dashboard is not
        # reachable from the internet by finding its address.
        proxy_pass https://192.168.40.233/tap;               # <- the home server
        # The name, not the address, in both the SNI and the Host: the home
        # nginx picks its server block by the Host header, and one that does
        # not match lands in whichever block is the default - which is not
        # necessarily the dashboard's. Its certificate is for the name too, so
        # the same word makes the handshake verifiable.
        proxy_ssl_server_name on;
        proxy_ssl_name                    mqtt.falco81.net;
        proxy_set_header Host             mqtt.falco81.net;    # <- the home vhost's name
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # A press that somebody has to approve is answered when they do, which
        # is a minute away; the daemon gives up before this does.
        # nginx does not check the home server's certificate unless it is told
        # to. Over a private link between two machines you own that is a
        # reasonable place to stop; to check it, name the CA and turn it on:
        #
        #     proxy_ssl_trusted_certificate /etc/nginx/certs/server.ca;
        #     proxy_ssl_verify on;
        #     proxy_ssl_verify_depth 3;
        proxy_read_timeout    120s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
